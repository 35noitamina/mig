[package]
name = "mig"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", optional = true }
egui_commonmark = { version = "0.25.0", optional = true }
egui_extras = { version = "0.36.2", features = ["syntect", "image"], optional = true }
git2 = { version = "0.21.0", features = ["https", "ssh"] }
globset = "0.4.20"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
notify-rust = { version = "4.18.2", optional = true }
regex = "1.13.1"
rfd = { version = "0.17.2", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = { version = "0.25.17", optional = true }
ureq = { version = "3.4.2", features = ["json"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:notify-rust", "dep:rfd", "dep:toml_edit", "dep:egui_commonmark", "dep:rusqlite", "dep:image"]
