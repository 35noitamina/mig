[package]
name = "mig"
version = "0.3.1"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
epaint_default_fonts = "0.36.2"
eframe = { version = "0.36.2", optional = true }
egui_commonmark = { version = "0.25.0", optional = true }
egui_extras = { version = "0.36.2", features = ["syntect", "image"], optional = true }
git2 = { version = "0.21.0", features = ["https", "ssh"] }
globset = "0.4.20"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
notify-rust = { version = "4.18.2", optional = true }
png = "0.18.1"
regex = "1.13.1"
rfd = { version = "0.17.2", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
skrifa = { version = "0.44.0", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", optional = true }
ureq = { version = "3.4.2", features = ["json"] }
notify = "8.2.0"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:notify-rust", "dep:rfd", "dep:toml_edit", "dep:egui_commonmark", "dep:rusqlite", "dep:image", "dep:skrifa", "dep:two-face"]
